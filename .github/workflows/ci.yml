name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [24, 26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:package
      - name: Upload tested dist
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.os == 'ubuntu-latest' && matrix.node == 24
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  commit-dist:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Remove previous dist
        run: node scripts/clean.mjs
      - name: Download tested dist
        uses: actions/download-artifact@v8
        with:
          name: dist-${{ github.sha }}
          path: dist/
      - name: Commit dist if main still matches the tested revision
        shell: bash
        run: |
          remote_sha="$(git ls-remote --exit-code origin refs/heads/main | cut -f1)"
          if [[ "$remote_sha" != "$GITHUB_SHA" ]]; then
            echo "main has advanced; skipping dist from this revision."
            exit 0
          fi

          git add --all -- dist
          if git diff --cached --quiet; then
            echo "dist is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update dist"

          # A regular push rejects concurrent changes to main.
          if ! git push origin HEAD:refs/heads/main; then
            remote_sha="$(git ls-remote --exit-code origin refs/heads/main | cut -f1)"
            if [[ "$remote_sha" != "$GITHUB_SHA" ]]; then
              echo "main advanced during the push; skipping this dist commit."
              exit 0
            fi
            echo "::error::Unable to push dist. Check Actions permissions and main branch rules."
            exit 1
          fi
